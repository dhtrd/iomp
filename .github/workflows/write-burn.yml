name: اختبار نفاد حصّة الكتابة (لمرة واحدة)
on:
  push:
    branches: [ops/write-burn]
jobs:
  burn:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm install firebase-admin
      - name: حذف بيانات الاختبار zz_quota_test
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MODE: cleanup
        run: node ops/write_burn.mjs
